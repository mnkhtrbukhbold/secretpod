name: secretpod_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.0.3
  serverpod_database: 4.0.3
  serverpod_shared: 4.0.3
  serverpod_cloud_storage: 4.0.3
  cryptography: ^2.7.0
  crypto: ^3.0.7
  synchronized: ^3.3.0
  uuid: ^4.5.1

dev_dependencies:
  secretpod_client:
    path: ../secretpod_client
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.3
  test: ^1.25.5

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\secretpod_flutter
        & set ARGS=web --base-href /
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\secretpod_server\web\app
      posix: |
        rm -rf ../secretpod_server/web/app
        cd ../secretpod_flutter
        set -- web --base-href / --output ../secretpod_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    secretpod:
      path: ../secretpod_flutter
      displayName: "SecretPod"
      auto_launch: true
      target: lib/driver.dart
