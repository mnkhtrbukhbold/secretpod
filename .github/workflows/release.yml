name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Release coordinates
        id: release
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: secretpod:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify deployment before publishing
        run: python3 tests/docker_lifecycle.py --image secretpod:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/manager.Dockerfile
          load: true
          tags: secretpod-manager:test
      - name: Verify Python-free setup and maintenance
        run: python3 tests/container_manager_lifecycle.py --image secretpod:test --manager-image secretpod-manager:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker tag secretpod:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          docker tag secretpod-manager:test "$IMAGE-manager:$VERSION"
          docker push "$IMAGE-manager:$VERSION"
      - name: Publish portable prebuilt image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker save "$IMAGE:$VERSION" | gzip > secretpod-linux-amd64.tar.gz
          sha256sum secretpod-linux-amd64.tar.gz > secretpod-linux-amd64.tar.gz.sha256
          docker save "$IMAGE-manager:$VERSION" | gzip > secretpod-manager-linux-amd64.tar.gz
          sha256sum secretpod-manager-linux-amd64.tar.gz > secretpod-manager-linux-amd64.tar.gz.sha256
          gh release create "v$VERSION" secretpod-linux-amd64.tar.gz secretpod-linux-amd64.tar.gz.sha256 secretpod-manager-linux-amd64.tar.gz secretpod-manager-linux-amd64.tar.gz.sha256 --verify-tag --title "SecretPod $VERSION" --notes "Prebuilt Linux amd64 app and manager images. No host Python required. See docs/self-hosting.md for setup and maintenance."
